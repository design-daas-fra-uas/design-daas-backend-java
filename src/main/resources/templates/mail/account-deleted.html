<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>DESIGN DaaS — Account Deleted</title>
</head>
<body style="font-family: Arial, sans-serif; color: #222; margin: 0; padding: 24px; background-color: #f4f4f4;">
<table cellpadding="0" cellspacing="0" role="presentation" width="100%">
    <tr>
        <td align="center">
            <table cellpadding="0" cellspacing="0" role="presentation"
                   style="background-color: #ffffff; border-radius: 8px; padding: 32px;"
                   width="480">
                <tr>
                    <td>
                        <h1 style="font-size: 20px; margin: 0 0 16px;">Your account has been deleted</h1>
                        <p style="margin: 0 0 16px;">
                            Hello <span th:text="${userName}">User</span>,
                        </p>
                        <p style="margin: 0 0 16px;">
                            an administrator has deleted your DESIGN DaaS account
                            (<span th:text="${userEmail}">user@example.com</span>).
                            You can no longer log in, and all of your sessions have been ended.
                        </p>
                        <p style="margin: 0; color: #666; font-size: 13px;">
                            If you think this was a mistake, please contact your DESIGN DaaS administrator.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
