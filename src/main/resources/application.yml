server:
  port: 8080

management:
  health:
    mail:
      enabled: ${MAIL_ENABLED:false}

spring:
  application:
    name: design-daas-backend

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/design_backend}
    username: ${DB_USERNAME:design}
    password: ${DB_PASSWORD:design}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  admin-initializer:
    enabled: true
    email: ${ADMIN_EMAIL:admin@design.local}
    password: ${ADMIN_PASSWORD:Admin123!}
  oauth2:
    keys-dir: ${OAUTH_KEYS_DIR:./keys}
    issuer: ${OAUTH_ISSUER:http://localhost:8080}
    access-token-ttl-seconds: ${OAUTH_ACCESS_TOKEN_TTL_SECONDS:3600}
    refresh-token-ttl-days: ${OAUTH_REFRESH_TOKEN_TTL_DAYS:30}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@design.local}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${app.frontend.url}}
  rate-limiting:
    enabled: ${RATE_LIMITING_ENABLED:true}
    auth-token-requests-per-minute: ${RATE_LIMIT_AUTH_TOKEN:20}
    register-requests-per-minute: ${RATE_LIMIT_REGISTER:5}
    validate-email-requests-per-minute: ${RATE_LIMIT_VALIDATE_EMAIL:10}
    trusted-proxy-ranges: ${RATE_LIMIT_TRUSTED_PROXIES:127.0.0.1/32,::1/128}
  security:
    swagger-public: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    de.frauas.design.backend: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.springframework.security.oauth2: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{40} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{40} - %msg%n"
