S-Anwendung</text><line x1="210" y1="94" x2="210" y2="955" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/><rect x="540" y="24" width="320" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text x="700" y="55" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Backend</text><text x="700" y="77" font-family="DejaVu Sans" font-size="13.5" fill="#334155" text-anchor="middle">auth-Modul und Resource Server</text><line x1="700" y1="94" x2="700" y2="955" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/><rect x="1030" y="24" width="320" height="70" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.5"/><text x="1190" y="55" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Datenbank</text><text x="1190" y="77" font-family="DejaVu Sans" font-size="13.5" fill="#334155" text-anchor="middle">access_tokens, refresh_tokens</text><line x1="1190" y1="94" x2="1190" y2="955" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/><path d="M210,165 L696,165" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="455" y="156" font-family="DejaVu Sans" font-size="14" fill="#0f172a" text-anchor="middle">POST /oauth2/user/token (Password Grant)</text><path d="M700,205 L1186,205" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="945" y="196" font-family="DejaVu Sans" font-size="14" fill="#0f172a" text-anchor="middle">jti und Refresh-Token speichern</text><path d="M700,250 L214,250" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#a)"/><text x="455" y="241" font-family="DejaVu Sans" font-size="14" fill="#0f172a" text-anchor="middle">Zugriffstoken (1 h) + Refresh-Token (30 Tage)</text><path d="M210,345 L696,345" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="455" y="336" font-family="DejaVu Sans" font-size="14" fill="#0f172a" text-anchor="middle">API-Aufruf mit Authorization: Bearer …</text><rect x="525" y="362" width="350" height="36" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/><text x="700" y="384.75" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="middle">Signatur, Ablaufzeit und Aussteller prüfen</text><path d="M700,430 L1186,430" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="945" y="421" font-family="DejaVu Sans" font-size="14" fill="#0f172a" text-anchor="middle">jti widerrufen oder unbekannt?</text><path d="M1190,465 L704,465" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#a)"/><text x="945" y="456" font-family="DejaVu Sans" font-size="14" fill="#0f172a" text-anchor="middle">nein</text><path d="M700,500 L214,500" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#a)"/><text x="455" y="491" font-family="DejaVu Sans" font-size="14" fill="#0f172a" text-anchor="middle">Antwort (sonst 401 Unauthorized)</text><path d="M210,565 L696,565" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="455" y="556" font-family="DejaVu Sans" font-size="14" fill="#0f172a" text-anchor="middle">POST /oauth2/user/token (Refresh Grant)</text><path d="M700,610 L1186,610" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="945" y="601" font-family="DejaVu Sans" font-size="14" fill="#0f172a" text-anchor="middle">alten Refresh-Token widerrufen, neue Tokens speichern</text><path d="M700,655 L214,655" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#a)"/><text x="455" y="646" font-family="DejaVu Sans" font-size="14" fill="#0f172a" text-anchor="middle">neues Token-Paar</text><path d="M210,745 L696,745" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="455" y="736" font-family="DejaVu Sans" font-size="14" fill="#0f172a" text-anchor="middle">POST /oauth2/user/logout</text><path d="M700,790 L1186,790" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="945" y="781" font-family="DejaVu Sans" font-size="14" fill="#0f172a" text-anchor="middle">revoked = true (auch bei Passwortänderung oder Deaktivierung)</text><rect x="525" y="852" width="350" height="36" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/><text x="700" y="874.75" font-family="DejaVu Sans" font-size="13.5" font-weight="bold" fill="#0f172a" text-anchor="middle">TokenCleanupService, täglich 03:00 Uhr</text><path d="M700,935 L1186,935" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="945" y="926" font-family="DejaVu Sans" font-size="14" fill="#0f172a" text-anchor="middle">abgelaufene Zeilen löschen</text></svg>