="13.5" fill="#334155" text-anchor="middle">rsa-jwk.json (Signaturschlüssel)</text><path d="M690,430 L798,430" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="9 6"/><text x="1020" y="506" font-family="DejaVu Sans" font-size="13.5" fill="#334155" text-anchor="middle">muss Neustarts überdauern und</text><text x="1020" y="526" font-family="DejaVu Sans" font-size="13.5" fill="#334155" text-anchor="middle">für alle Instanzen identisch sein</text><path d="M330,544 L330,652" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="342" y="622" font-family="DejaVu Sans" font-size="14" font-style="italic" fill="#334155" text-anchor="start">JDBC</text><path d="M560,544 L560,600 L900,600 L900,662" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"/><text x="912" y="640" font-family="DejaVu Sans" font-size="14" font-style="italic" fill="#334155" text-anchor="start">SMTP</text><path d="M170,669 v82 a170,14 0 0 0 340,0 v-82" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.5"/><ellipse cx="340" cy="669" rx="170" ry="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.5"/><text x="340" y="718" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">MariaDB</text><text x="340" y="740" font-family="DejaVu Sans" font-size="13.5" fill="#334155" text-anchor="middle">Schema über Flyway</text><rect x="740" y="665" width="400" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="940" y="706" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">SMTP-Relay</text><text x="940" y="728" font-family="DejaVu Sans" font-size="13.5" fill="#334155" text-anchor="middle">nur bei MAIL_ENABLED=true</text></svg>